<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription – Ma super messagerie</title>

  <!-- CSS -->
  <link rel="stylesheet" href="assets/style/main.css">

  <!-- Favicon (optionnel) -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>

<header>
  <h1>s'inscrire</h1>
</header>

<main>

  <form id="signup-form">
    <div>
      <label for="pseudo">Pseudo</label>
      <input type="text" id="pseudo" name="pseudo" autocomplete="nickname" required>
    </div>

    <div>
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
    </div>

    <div>
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
      <ul id="password-requirements">
        <li id="req-length">Au moins 8 caractères</li>
        <li id="req-uppercase">Une majuscule</li>
        <li id="req-number">Un chiffre</li>
      </ul>
    </div>

    <div>
      <label for="password-confirm">Confirmer le mot de passe</label>
      <input type="password" id="password-confirm" name="password-confirm" autocomplete="new-password" minlength="8" required>
    </div>

    <button type="submit">S'inscrire</button>
  </form>

  <a href="sign_in.html">Déjà un compte ? Se connecter</a>

  <a href="index.html" class="btn">retourner à l'accueil</a>
</main>

<footer>
  <p>&copy; <script>document.write(new Date().getFullYear())</script> - Tous droits réservés</p>
  <nav>
    <a href="politique-confidentialite.html">Politique de confidentialité</a> ·
    <a href="conditions-utilisation.html">Conditions d'utilisation</a> ·
    <a href="informations-legales.html">Informations légales</a>
  </nav>
</footer>

<!-- JS en fin de body pour ne pas bloquer le rendu -->
<script src="assets/js/main.js"></script>
</body>
</html>
