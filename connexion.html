<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion – Wallo</title>

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/main.css">

</head>
<body>


<main>
    <div class="form-connexion">
        <h1>Formulaire de connexion</h1>
        <form id="signin-form">
            <div>
                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>

            <div>
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>

            <button type="submit">Se connecter</button>
            <p id="signin-status" class="form-status"></p>
        </form>
    </div>
    <a href="inscription.html">Pas encore de compte ? S'inscrire</a>

    <a href="index.html" class="btn">retourner à l'accueil</a>
</main>

<footer>
    <p>&copy; <script>document.write(new Date().getFullYear())</script> - Tous droits réservés</p>
    <nav>
        <a href="politique-confidentialite.html">Politique de confidentialité</a>
    </nav>
</footer>

<!-- JS en fin de body pour ne pas bloquer le rendu -->
<script src="assets/js/main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>
</body>
</html>
